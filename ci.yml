name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check main.py test_main.py make_diagrams.py make_3d.py --select E9,F,I
      - run: python -m pytest -q --cov=main --cov-report=term-missing
      - run: python main.py taylor-green --out ci_out
      - run: python main.py channel --out ci_out
      - run: python main.py pipe --diameter 0.05 --length 100 --velocity 2 --minor-k 2.5
      - run: python main.py convergence --grids 17 33 --out ci_out
      - run: python main.py convection --ra 1e3 --n 25 --out ci_out
      - run: python main.py blasius --u-inf 5 --nu 1.5e-5 --x 0.5 --out ci_out
      - run: python main.py network --spec network_example.json --out ci_out
      - run: python main.py pump --shutoff-head 40 --design-flow 0.01 --design-head 30 --diameter 0.1 --length 200 --static-head 10
      - run: python main.py open-channel --flow 5 --width 3 --slope 0.001
      - run: python main.py backwater --flow 5 --width 3 --slope 0.001 --y-control 2 --length 3000
      - run: python main.py jump --flow 5 --width 3 --y1 0.4
      - run: python main.py cavity --n 17 --max-time 20 --plot3d --out ci_out
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fluidflow .
      - run: docker run --rm fluidflow pipe --diameter 0.05 --length 100 --velocity 2
